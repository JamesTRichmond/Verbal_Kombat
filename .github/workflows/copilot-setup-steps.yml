name: Copilot Setup Steps

# Provision network-dependent tooling before the coding-agent firewall is enabled.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install browser automation tooling
        run: npx --yes playwright@1.55.0 install --with-deps chromium
